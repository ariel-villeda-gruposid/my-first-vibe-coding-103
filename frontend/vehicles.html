<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Management - Vehicles</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-container">
    <!-- Navigation -->
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-header">
        <h1 class="logo">Fleet Manager</h1>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="index.html" class="nav-link">
            <span class="nav-icon" aria-hidden="true">📊</span>
            <span class="nav-text">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="vehicles.html" class="nav-link active" aria-current="page">
            <span class="nav-icon" aria-hidden="true">🚗</span>
            <span class="nav-text">Vehicles</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="drivers.html" class="nav-link">
            <span class="nav-icon" aria-hidden="true">👤</span>
            <span class="nav-text">Drivers</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="assignments.html" class="nav-link">
            <span class="nav-icon" aria-hidden="true">📋</span>
            <span class="nav-text">Assignments</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <header class="page-header">
        <h2 class="page-title">Vehicles</h2>
        <button class="btn btn-primary" id="addVehicleBtn" aria-label="Add new vehicle">
          + Add Vehicle
        </button>
      </header>

      <!-- Filters -->
      <section class="filters-bar" aria-label="Filter vehicles">
        <div class="filter-group">
          <label for="statusFilter" class="filter-label">Status:</label>
          <select id="statusFilter" class="filter-select">
            <option value="">All</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="maintenance">Maintenance</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="typeFilter" class="filter-label">Type:</label>
          <select id="typeFilter" class="filter-select">
            <option value="">All</option>
            <option value="sedan">Sedan</option>
            <option value="suv">SUV</option>
            <option value="truck">Truck</option>
            <option value="van">Van</option>
          </select>
        </div>
      </section>

      <!-- Vehicles Table -->
      <section class="table-container" aria-label="Vehicles list">
        <table class="data-table" id="vehiclesTable">
          <thead>
            <tr>
              <th scope="col">Plate Number</th>
              <th scope="col">Model</th>
              <th scope="col">Year</th>
              <th scope="col">Type</th>
              <th scope="col">Fuel</th>
              <th scope="col">Status</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="vehiclesTableBody">
            <!-- Vehicle rows will be inserted here by JavaScript -->
            <tr class="loading-row">
              <td colspan="7">Loading vehicles...</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Pagination -->
      <nav class="pagination" aria-label="Vehicles pagination">
        <button class="btn btn-secondary" id="prevPage" disabled>Previous</button>
        <span class="pagination-info" id="paginationInfo">Page 1</span>
        <button class="btn btn-secondary" id="nextPage">Next</button>
      </nav>
    </main>
  </div>

  <!-- Vehicle Modal -->
  <div class="modal" id="vehicleModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content">
      <header class="modal-header">
        <h3 class="modal-title" id="modalTitle">Add Vehicle</h3>
        <button class="modal-close" data-close-modal aria-label="Close modal">&times;</button>
      </header>
      <form id="vehicleForm" class="modal-body">
        <div class="form-group">
          <label for="plateNumber" class="form-label">Plate Number *</label>
          <input type="text" id="plateNumber" name="plate_number" class="form-input" 
                 required maxlength="10" pattern="[A-Za-z0-9]+" 
                 aria-describedby="plateHelp">
          <small id="plateHelp" class="form-help">Alphanumeric, max 10 characters</small>
        </div>
        <div class="form-group">
          <label for="model" class="form-label">Model *</label>
          <input type="text" id="model" name="model" class="form-input" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="year" class="form-label">Year *</label>
            <input type="number" id="year" name="year" class="form-input" 
                   required min="1996" max="2030">
          </div>
          <div class="form-group">
            <label for="type" class="form-label">Type *</label>
            <select id="type" name="type" class="form-select" required>
              <option value="">Select type</option>
              <option value="sedan">Sedan</option>
              <option value="suv">SUV</option>
              <option value="truck">Truck</option>
              <option value="van">Van</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="fuelType" class="form-label">Fuel Type *</label>
            <select id="fuelType" name="fuel_type" class="form-select" required>
              <option value="">Select fuel type</option>
              <option value="gasoline">Gasoline</option>
              <option value="diesel">Diesel</option>
              <option value="electric">Electric</option>
              <option value="hybrid">Hybrid</option>
            </select>
          </div>
          <div class="form-group">
            <label for="status" class="form-label">Status *</label>
            <select id="status" name="status" class="form-select" required>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="maintenance">Maintenance</option>
            </select>
          </div>
        </div>
      </form>
      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
        <button type="submit" form="vehicleForm" class="btn btn-primary">Save Vehicle</button>
      </footer>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" hidden>
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content modal-sm">
      <header class="modal-header">
        <h3 class="modal-title" id="deleteModalTitle">Confirm Delete</h3>
        <button class="modal-close" data-close-modal aria-label="Close modal">&times;</button>
      </header>
      <div class="modal-body">
        <p>Are you sure you want to delete this vehicle?</p>
        <p class="text-muted" id="deleteVehicleInfo"></p>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
      </footer>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pages/vehicles.js"></script>
</body>
</html>
