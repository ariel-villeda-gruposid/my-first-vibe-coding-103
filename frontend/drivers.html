<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Management - Drivers</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-container">
    <!-- Navigation -->
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-header">
        <h1 class="logo">Fleet Manager</h1>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="index.html" class="nav-link">
            <span class="nav-icon" aria-hidden="true">📊</span>
            <span class="nav-text">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="vehicles.html" class="nav-link">
            <span class="nav-icon" aria-hidden="true">🚗</span>
            <span class="nav-text">Vehicles</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="drivers.html" class="nav-link active" aria-current="page">
            <span class="nav-icon" aria-hidden="true">👤</span>
            <span class="nav-text">Drivers</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="assignments.html" class="nav-link">
            <span class="nav-icon" aria-hidden="true">📋</span>
            <span class="nav-text">Assignments</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <header class="page-header">
        <h2 class="page-title">Drivers</h2>
        <button class="btn btn-primary" id="addDriverBtn" aria-label="Add new driver">
          + Add Driver
        </button>
      </header>

      <!-- Filters -->
      <section class="filters-bar" aria-label="Filter drivers">
        <div class="filter-group">
          <label for="statusFilter" class="filter-label">Status:</label>
          <select id="statusFilter" class="filter-select">
            <option value="">All</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
          </select>
        </div>
      </section>

      <!-- Drivers Table -->
      <section class="table-container" aria-label="Drivers list">
        <table class="data-table" id="driversTable">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">License Number</th>
              <th scope="col">Contact</th>
              <th scope="col">Status</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="driversTableBody">
            <!-- Driver rows will be inserted here by JavaScript -->
            <tr class="loading-row">
              <td colspan="5">Loading drivers...</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Pagination -->
      <nav class="pagination" aria-label="Drivers pagination">
        <button class="btn btn-secondary" id="prevPage" disabled>Previous</button>
        <span class="pagination-info" id="paginationInfo">Page 1</span>
        <button class="btn btn-secondary" id="nextPage">Next</button>
      </nav>
    </main>
  </div>

  <!-- Driver Modal -->
  <div class="modal" id="driverModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content">
      <header class="modal-header">
        <h3 class="modal-title" id="modalTitle">Add Driver</h3>
        <button class="modal-close" data-close-modal aria-label="Close modal">&times;</button>
      </header>
      <form id="driverForm" class="modal-body">
        <div class="form-group">
          <label for="name" class="form-label">Name *</label>
          <input type="text" id="name" name="name" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="licenseNumber" class="form-label">License Number *</label>
          <input type="text" id="licenseNumber" name="license_number" class="form-input" 
                 required pattern="[A-Za-z0-9]+"
                 aria-describedby="licenseHelp">
          <small id="licenseHelp" class="form-help">Alphanumeric characters only</small>
        </div>
        <div class="form-group">
          <label for="contactNumber" class="form-label">Contact Number *</label>
          <input type="tel" id="contactNumber" name="contact_number" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="status" class="form-label">Status *</label>
          <select id="status" name="status" class="form-select" required>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
          </select>
        </div>
      </form>
      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
        <button type="submit" form="driverForm" class="btn btn-primary">Save Driver</button>
      </footer>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" hidden>
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content modal-sm">
      <header class="modal-header">
        <h3 class="modal-title" id="deleteModalTitle">Confirm Delete</h3>
        <button class="modal-close" data-close-modal aria-label="Close modal">&times;</button>
      </header>
      <div class="modal-body">
        <p>Are you sure you want to delete this driver?</p>
        <p class="text-muted" id="deleteDriverInfo"></p>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
      </footer>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pages/drivers.js"></script>
</body>
</html>
